name: petshop_applications
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  firebase_core: ^2.32.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_svg: ^2.0.17 
  build_runner: ^2.4.13
  flutter_gen: 5.8.0
  firebase_auth: ^4.16.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.4
  

flutter:
  uses-material-design: true
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Italic.ttf

        - asset: assets/fonts/NotoSans/NotoSans.ttf
          weight: 700

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/